sonar.sources=backend,frontend
sonar.tests=backend,frontend
sonar.test.inclusions=backend/**/tests.py,backend/**/tests/**/*.py,frontend/**/__tests__/**/*.test.ts,frontend/**/__tests__/**/*.test.tsx
sonar.exclusions=backend/**/migrations/**,backend/env/**,backend/media/**,frontend/coverage/**,frontend/.next/**,node_modules/**
sonar.coverage.exclusions=frontend/app/api/**,frontend/app/admin/**,frontend/app/support/**,frontend/app/login/**,frontend/app/signup/**,frontend/app/layout.tsx,frontend/app/providers.tsx,frontend/app/page.tsx,frontend/app/staff/page.tsx,frontend/app/staff/ticket/**
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
